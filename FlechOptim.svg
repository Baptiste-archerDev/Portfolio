<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">FlèchOptim — choisir une flèche</title>
  <desc id="desc">Illustration technique d'une flèche et de sa courbe de flexion, avec les paramètres puissance, longueur et pointe.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#33342e" stroke-width="1"/>
    </pattern>
    <linearGradient id="shaft" x1="0" x2="1">
      <stop offset="0" stop-color="#6ab893"/>
      <stop offset="1" stop-color="#d7965e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="#191915"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity=".55"/>
  <circle cx="1010" cy="160" r="125" fill="#22231e"/>
  <circle cx="1010" cy="160" r="86" fill="none" stroke="#41443a" stroke-width="2"/>
  <circle cx="1010" cy="160" r="48" fill="none" stroke="#41443a" stroke-width="2"/>
  <circle cx="1010" cy="160" r="10" fill="#d7965e"/>
  <text x="72" y="98" fill="#6ab893" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">SÉLECTEUR DE FLÈCHES</text>
  <text x="72" y="185" fill="#f4f1e9" font-family="Arial, sans-serif" font-size="72" font-weight="700">FlèchOptim</text>
  <text x="76" y="232" fill="#a5a69d" font-family="Arial, sans-serif" font-size="24">Trouver le spine adapté à son arc</text>
  <path d="M135 490H1040" stroke="url(#shaft)" stroke-width="12" stroke-linecap="round"/>
  <path d="M1040 490l-54-31v62z" fill="#d7965e"/>
  <path d="M135 490l-52-33v66z" fill="#6ab893"/>
  <path d="M205 490C390 378 710 378 915 490" fill="none" stroke="#6ab893" stroke-width="5" stroke-dasharray="11 13"/>
  <path d="M205 490C390 602 710 602 915 490" fill="none" stroke="#d7965e" stroke-width="3" stroke-dasharray="7 14" opacity=".8"/>
  <text x="454" y="370" fill="#6ab893" font-family="Arial, sans-serif" font-size="24" font-weight="700">FLEXION · SPINE</text>
  <text x="397" y="559" fill="#a5a69d" font-family="Arial, sans-serif" font-size="21">LONGUEUR RÉELLE DU TUBE</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="694" width="320" height="126" rx="12" fill="#22231e" stroke="#41443a" stroke-width="2"/>
    <rect x="440" y="694" width="320" height="126" rx="12" fill="#22231e" stroke="#41443a" stroke-width="2"/>
    <rect x="808" y="694" width="320" height="126" rx="12" fill="#22231e" stroke="#41443a" stroke-width="2"/>
    <text x="102" y="742" fill="#a5a69d" font-size="18" font-weight="700" letter-spacing="2">PUISSANCE</text>
    <text x="102" y="790" fill="#f4f1e9" font-size="30" font-weight="700">Type d'arc</text>
    <text x="470" y="742" fill="#a5a69d" font-size="18" font-weight="700" letter-spacing="2">LONGUEUR</text>
    <text x="470" y="790" fill="#f4f1e9" font-size="30" font-weight="700">Tube / allonge</text>
    <text x="838" y="742" fill="#a5a69d" font-size="18" font-weight="700" letter-spacing="2">CATALOGUE</text>
    <text x="838" y="790" fill="#f4f1e9" font-size="30" font-weight="700">Comparer</text>
  </g>
</svg>
